name: Ubuntu 26.04 LXQt + XRDP + Tailscale

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: namespace-profile-linux1

    steps:

      # ==========================================
      # SYSTEM INFORMATION
      # ==========================================

      - name: Check system
        run: |
          echo "===== OS ====="
          cat /etc/os-release

          echo
          echo "===== Kernel ====="
          uname -a

          echo
          echo "===== PID 1 ====="
          ps -p 1 -o pid,comm,args


      # ==========================================
      # UPDATE SYSTEM
      # ==========================================

      - name: Update system
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive \
            apt-get upgrade -y


      # ==========================================
      # INSTALL LXQT + XRDP + DBUS
      # ==========================================

      - name: Install LXQt XRDP Xorg and DBus
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            lxqt \
            lxqt-core \
            xrdp \
            xorgxrdp \
            dbus-x11 \
            dbus-user-session \
            dbus \
            xserver-xorg-core \
            xserver-xorg-input-all \
            curl \
            ca-certificates \
            gnupg \
            iproute2 \
            procps


      # ==========================================
      # CREATE RDP USER
      # ==========================================

      - name: Create RDP user
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

        run: |

          if [ -z "$RDP_PASSWORD" ]; then
            echo "::error::RDP_PASSWORD GitHub Secret is missing or empty."
            exit 1
          fi

          if ! id xrdpuser >/dev/null 2>&1; then
            sudo useradd \
              --create-home \
              --shell /bin/bash \
              xrdpuser
          fi

          printf '%s:%s\n' \
            "xrdpuser" "$RDP_PASSWORD" | sudo chpasswd

          sudo usermod -aG sudo,ssl-cert xrdpuser

          echo "RDP user successfully created."


      # ==========================================
      # CREATE LXQT SESSION
      # ==========================================

      - name: Configure LXQt session
        run: |

          sudo mkdir -p \
            /home/xrdpuser/.config

          sudo tee \
            /home/xrdpuser/.xsession > /dev/null <<'EOF'
          #!/bin/sh

          export LANG=C.UTF-8
          export LANGUAGE=C.UTF-8
          export LC_ALL=C.UTF-8

          export XDG_CURRENT_DESKTOP=LXQt
          export XDG_SESSION_DESKTOP=LXQt

          export XDG_CONFIG_DIRS=/etc/xdg/xdg-LXQt:/etc/xdg
          export XDG_DATA_DIRS=/usr/share/lxqt:/usr/local/share:/usr/share

          exec dbus-launch --exit-with-session startlxqt
          EOF

          sudo chmod +x \
            /home/xrdpuser/.xsession

          sudo chown xrdpuser:xrdpuser \
            /home/xrdpuser/.xsession

          sudo chown -R xrdpuser:xrdpuser \
            /home/xrdpuser/.config


      # ==========================================
      # CONFIGURE XRDP
      # ==========================================

      - name: Configure XRDP
        run: |

          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          export LANG=C.UTF-8
          export LANGUAGE=C.UTF-8
          export LC_ALL=C.UTF-8

          export XDG_CURRENT_DESKTOP=LXQt
          export XDG_SESSION_DESKTOP=LXQt

          export XDG_CONFIG_DIRS=/etc/xdg/xdg-LXQt:/etc/xdg
          export XDG_DATA_DIRS=/usr/share/lxqt:/usr/local/share:/usr/share

          exec /home/xrdpuser/.xsession
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh


      # ==========================================
      # XRDP RUNTIME DIRECTORY
      # ==========================================

      - name: Prepare XRDP runtime
        run: |

          sudo mkdir -p /run/xrdp

          sudo chown xrdp:xrdp \
            /run/xrdp

          sudo chmod 755 \
            /run/xrdp

          sudo rm -f \
            /run/xrdp/xrdp.pid \
            /run/xrdp/xrdp-sesman.pid


      # ==========================================
      # START XRDP WITHOUT SYSTEMD
      # ==========================================

      - name: Start XRDP
        run: |

          echo "Stopping existing XRDP processes..."

          sudo pkill xrdp || true
          sudo pkill xrdp-sesman || true

          sleep 2

          echo "Starting xrdp-sesman..."

          sudo /usr/sbin/xrdp-sesman \
            --nodaemon \
            > /tmp/xrdp-sesman.log 2>&1 &

          sleep 3

          echo "Starting xrdp..."

          sudo /usr/sbin/xrdp \
            --nodaemon \
            > /tmp/xrdp.log 2>&1 &

          sleep 5

          echo
          echo "===== XRDP PROCESSES ====="

          ps aux | grep -E \
            'xrdp|xrdp-sesman' | grep -v grep || true

          echo
          echo "===== PORT 3389 ====="

          sudo ss -lntp | grep ':3389' || true

          echo
          echo "===== XRDP LOG ====="

          sudo cat /tmp/xrdp.log || true

          echo
          echo "===== XRDP SESMAN LOG ====="

          sudo cat /tmp/xrdp-sesman.log || true


      # ==========================================
      # INSTALL TAILSCALE
      # ==========================================

      - name: Install Tailscale
        run: |

          curl -fsSL \
            https://tailscale.com/install.sh | sh


      # ==========================================
      # START TAILSCALE WITHOUT SYSTEMD
      # ==========================================

      - name: Start tailscaled
        run: |

          if ! command -v tailscaled >/dev/null 2>&1; then
            echo "::error::tailscaled was not installed."
            exit 1
          fi

          sudo mkdir -p \
            /var/lib/tailscale \
            /run/tailscale

          sudo pkill tailscaled || true

          sleep 2

          echo "Starting tailscaled..."

          sudo tailscaled \
            --state=/var/lib/tailscale/tailscaled.state \
            --socket=/run/tailscale/tailscaled.sock \
            > /tmp/tailscaled.log 2>&1 &

          echo "Waiting for tailscaled..."

          TAILSCALE_READY=false

          for i in $(seq 1 30); do

            if sudo tailscale \
              --socket=/run/tailscale/tailscaled.sock \
              status >/dev/null 2>&1; then

              TAILSCALE_READY=true
              echo "tailscaled is ready."
              break

            fi

            sleep 1

          done

          if [ "$TAILSCALE_READY" != "true" ]; then
            echo "::error::tailscaled failed to start."

            echo
            echo "===== tailscaled log ====="

            sudo cat /tmp/tailscaled.log || true

            exit 1
          fi


      # ==========================================
      # CONNECT TAILSCALE
      # ==========================================

      - name: Connect Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}

        run: |

          if [ -z "$TS_AUTHKEY" ]; then
            echo "::error::TS_AUTHKEY GitHub Secret is missing or empty."
            exit 1
          fi

          sudo tailscale \
            --socket=/run/tailscale/tailscaled.sock \
            up \
            --auth-key="$TS_AUTHKEY" \
            --hostname="github-lxqt-${GITHUB_RUN_ID}"

          sleep 5


      # ==========================================
      # SHOW CONNECTION INFORMATION
      # ==========================================

      - name: Show connection information
        run: |

          echo
          echo "=========================================="
          echo " Ubuntu 26.04"
          echo " LXQt"
          echo " XRDP"
          echo " Xorg"
          echo " Tailscale"
          echo "=========================================="

          echo
          echo "===== TAILSCALE IPv4 ====="

          sudo tailscale \
            --socket=/run/tailscale/tailscaled.sock \
            ip -4

          echo
          echo "===== TAILSCALE STATUS ====="

          sudo tailscale \
            --socket=/run/tailscale/tailscaled.sock \
            status

          echo
          echo "===== XRDP PROCESSES ====="

          ps aux | grep -E \
            'xrdp|xrdp-sesman' | grep -v grep || true

          echo
          echo "===== RDP PORT ====="

          sudo ss -lntp | grep ':3389' || true

          echo
          echo "=========================================="
          echo "RDP Username: xrdpuser"
          echo "RDP Port: 3389"
          echo "XRDP Session: Xorg"
          echo "Desktop: LXQt"
          echo "=========================================="


      # ==========================================
      # KEEP RUNNER ALIVE
      # ==========================================

      - name: Keep runner alive
        run: |

          echo "=========================================="
          echo "LXQt Remote Desktop is ready."
          echo "=========================================="

          while true; do

            echo
            echo "===== STATUS ====="

            date

            echo
            echo "Tailscale:"

            sudo tailscale \
              --socket=/run/tailscale/tailscaled.sock \
              status || true

            echo
            echo "XRDP:"

            ps aux | grep -E \
              'xrdp|xrdp-sesman' | grep -v grep || true

            echo
            echo "Port 3389:"

            sudo ss -lntp | grep ':3389' || true

            sleep 60

          done
