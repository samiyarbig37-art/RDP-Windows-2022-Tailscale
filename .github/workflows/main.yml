name: Ubuntu 26.04 LXQt + XRDP + Tailscale

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: namespace-profile-linux1

    steps:

      # ==========================================
      # OS INFORMATION
      # ==========================================

      - name: Check system
        run: |
          echo "===== OS ====="
          cat /etc/os-release

          echo
          echo "===== Init ====="
          ps -p 1 -o pid,comm,args

          echo
          echo "===== Kernel ====="
          uname -a


      # ==========================================
      # UPDATE
      # ==========================================

      - name: Update system
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive \
            apt-get upgrade -y


      # ==========================================
      # INSTALL LXQT + XRDP
      # ==========================================

      - name: Install LXQt and XRDP
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            lxqt \
            lxqt-core \
            xrdp \
            xorgxrdp \
            dbus-x11 \
            dbus-user-session \
            curl \
            ca-certificates \
            gnupg \
            iproute2 \
            procps


      # ==========================================
      # CREATE RDP USER
      # ==========================================

      - name: Create RDP user
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

        run: |

          if [ -z "$RDP_PASSWORD" ]; then
            echo "::error::RDP_PASSWORD is missing."
            exit 1
          fi

          if ! id xrdpuser >/dev/null 2>&1; then
            sudo useradd \
              --create-home \
              --shell /bin/bash \
              xrdpuser
          fi

          printf '%s:%s\n' \
            "xrdpuser" "$RDP_PASSWORD" | sudo chpasswd

          sudo usermod -aG sudo,ssl-cert xrdpuser

          echo "RDP user created."


      # ==========================================
      # CONFIGURE LXQT
      # ==========================================

      - name: Configure LXQt
        run: |

          sudo -u xrdpuser bash -c \
            'echo "startlxqt" > /home/xrdpuser/.xsession'

          sudo chown \
            xrdpuser:xrdpuser \
            /home/xrdpuser/.xsession

          sudo chmod 644 \
            /home/xrdpuser/.xsession


      # ==========================================
      # CONFIGURE XRDP
      # ==========================================

      - name: Configure XRDP
        run: |

          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          export LANG=C.UTF-8
          export LANGUAGE=C.UTF-8
          export LC_ALL=C.UTF-8

          export XDG_CURRENT_DESKTOP=LXQt
          export XDG_SESSION_DESKTOP=LXQt

          export XDG_CONFIG_DIRS=/etc/xdg/xdg-LXQt:/etc/xdg
          export XDG_DATA_DIRS=/usr/share/lxqt:/usr/local/share:/usr/share

          exec startlxqt
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

          sudo mkdir -p /run/xrdp

          sudo chown xrdp:xrdp /run/xrdp

          sudo chmod 755 /run/xrdp


      # ==========================================
      # START XRDP WITHOUT SYSTEMD
      # ==========================================

      - name: Start XRDP
        run: |

          sudo pkill xrdp || true
          sudo pkill xrdp-sesman || true

          sleep 2

          sudo rm -f /run/xrdp/xrdp.pid
          sudo rm -f /run/xrdp/xrdp-sesman.pid

          echo "Starting xrdp-sesman..."

          sudo /usr/sbin/xrdp-sesman \
            --nodaemon \
            > /tmp/xrdp-sesman.log 2>&1 &

          sleep 2

          echo "Starting xrdp..."

          sudo /usr/sbin/xrdp \
            --nodaemon \
            > /tmp/xrdp.log 2>&1 &

          sleep 5

          echo
          echo "===== XRDP ====="

          ps aux | grep -E \
            'xrdp|xrdp-sesman' | grep -v grep || true

          echo
          echo "===== Port 3389 ====="

          sudo ss -lntp | grep ':3389' || true


      # ==========================================
      # INSTALL TAILSCALE
      # ==========================================

      - name: Install Tailscale
        run: |

          curl -fsSL \
            https://tailscale.com/install.sh | sh


      # ==========================================
      # START TAILSCALE DAEMON WITHOUT SYSTEMD
      # ==========================================

      - name: Start tailscaled
        run: |

          echo "Checking tailscaled..."

          command -v tailscaled || {
            echo "::error::tailscaled was not installed."
            exit 1
          }

          echo "Starting tailscaled manually..."

          sudo mkdir -p /var/lib/tailscale
          sudo mkdir -p /run/tailscale

          sudo pkill tailscaled || true

          sleep 2

          sudo tailscaled \
            --state=/var/lib/tailscale/tailscaled.state \
            --socket=/run/tailscale/tailscaled.sock \
            > /tmp/tailscaled.log 2>&1 &

          echo "Waiting for tailscaled..."

          for i in $(seq 1 30); do

            if sudo tailscale \
              --socket=/run/tailscale/tailscaled.sock \
              status >/dev/null 2>&1; then

              echo "tailscaled is running."

              break
            fi

            sleep 1

          done

          echo
          echo "===== tailscaled process ====="

          ps aux | grep tailscaled | grep -v grep || true

          echo
          echo "===== tailscaled log ====="

          sudo cat /tmp/tailscaled.log || true


      # ==========================================
      # CONNECT TAILSCALE
      # ==========================================

      - name: Connect Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}

        run: |

          if [ -z "$TS_AUTHKEY" ]; then
            echo "::error::TS_AUTHKEY is missing."
            exit 1
          fi

          echo "Connecting to Tailscale..."

          sudo tailscale \
            --socket=/run/tailscale/tailscaled.sock \
            up \
            --auth-key="$TS_AUTHKEY" \
            --hostname="github-lxqt-${GITHUB_RUN_ID}"

          sleep 5


      # ==========================================
      # SHOW CONNECTION INFO
      # ==========================================

      - name: Show connection information
        run: |

          echo
          echo "=========================================="
          echo " Ubuntu 26.04"
          echo " LXQt"
          echo " XRDP"
          echo " Tailscale"
          echo "=========================================="

          echo
          echo "===== Tailscale IPv4 ====="

          sudo tailscale \
            --socket=/run/tailscale/tailscaled.sock \
            ip -4

          echo
          echo "===== Tailscale status ====="

          sudo tailscale \
            --socket=/run/tailscale/tailscaled.sock \
            status

          echo
          echo "===== XRDP ====="

          ps aux | grep -E \
            'xrdp|xrdp-sesman' | grep -v grep || true

          echo
          echo "===== Port 3389 ====="

          sudo ss -lntp | grep ':3389' || true

          echo
          echo "=========================================="
          echo "RDP Username: xrdpuser"
          echo "RDP Port: 3389"
          echo "=========================================="


      # ==========================================
      # KEEP RUNNER ALIVE
      # ==========================================

      - name: Keep runner alive
        run: |

          echo "Remote desktop is ready."

          while true; do

            echo
            echo "===== Runner status ====="

            date

            echo
            echo "Tailscale:"
            sudo tailscale \
              --socket=/run/tailscale/tailscaled.sock \
              status || true

            echo
            echo "XRDP:"
            ps aux | grep -E \
              'xrdp|xrdp-sesman' | grep -v grep || true

            echo
            echo "RDP port:"
            sudo ss -lntp | grep ':3389' || true

            sleep 60

          done
